name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag at the selected workflow ref (for example, v0.2.0).
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify Release Identity and Notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Check existing tag, source version and authored notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: python scripts/check_release.py

  validate:
    name: Full Pre-release Validation
    needs: preflight
    uses: ./.github/workflows/pr-validation.yml

  build-release:
    name: Build Release Bundle
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$REQUESTED_TAG"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected semantic version format such as v1.2.3."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python scripts/lock_dependencies.py --check
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Recheck release identity before building
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: python scripts/check_release.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - name: Install console dependencies
        run: npm ci
        working-directory: frontend/console

      - name: Build deterministic static site bundle
        run: |
          python scripts/build_static_site_bundle.py --collector mock --reports-dir outputs/reports --figures-dir outputs/figures --dist-dir dist

      - name: Package release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          mkdir -p dist/release
          tar -czf "dist/release/cris-sme-site-${tag}.tar.gz" -C dist site
          tar -czf "dist/release/cris-sme-reports-${tag}.tar.gz" outputs/reports outputs/figures
          (cd dist && zip -r "release/cris-sme-site-${tag}.zip" site)

      - name: Assemble release evidence and checksums
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python scripts/dependency_license_inventory.py --ecosystem python --lock requirements/dev.txt --output dist/release/python-licenses.json
          python scripts/dependency_license_inventory.py --ecosystem npm --lock frontend/console/package-lock.json --output dist/release/npm-licenses.json
          cp "docs/releases/${RELEASE_TAG}.md" dist/release/release-notes.md
          cp dist/manifests/build-metadata.json dist/release/build-metadata.json
          python scripts/release_checksums.py

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cris-sme-release-${{ steps.meta.outputs.tag }}
          path: |
            dist/release
            dist/manifests/build-metadata.json
          retention-days: 30

      - name: Upload static site preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cris-sme-site-preview-${{ steps.meta.outputs.tag }}
          path: dist/site
          retention-days: 30

      - name: Release bundle summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ.get("RELEASE_TAG", "unknown")
          manifest = json.loads(Path("dist/manifests/build-metadata.json").read_text(encoding="utf-8"))
          lines = [
              "## Release Bundle Summary",
              "",
              f"- Release tag: `{tag}`",
              f"- Project version: `{manifest.get('project_version', 'unknown')}`",
              "- Included archives:",
              f"  - `cris-sme-site-{tag}.tar.gz`",
              f"  - `cris-sme-site-{tag}.zip`",
              f"  - `cris-sme-reports-{tag}.tar.gz`",
              "- Included preview artifact: `dist/site`",
              "- Included manifest: `dist/manifests/build-metadata.json`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}

      - name: Create draft GitHub release for maintainer review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: docs/releases/${{ steps.meta.outputs.tag }}.md
          draft: true
          make_latest: false
          files: |
            dist/release/*
