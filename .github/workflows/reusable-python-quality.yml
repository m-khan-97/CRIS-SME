name: Reusable Python Quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python runtime version.
        required: false
        default: "3.11"
        type: string
      run-mock-pipeline:
        description: Run the deterministic mock assessment pipeline.
        required: false
        default: false
        type: boolean
      upload-generated-artifacts:
        description: Upload generated report and figure artifacts.
        required: false
        default: false
        type: boolean

jobs:
  quality:
    name: Lint, Type, Test, and Pipeline Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
            pyproject.toml

      - name: Install dependencies and QA tooling
        id: install
        run: |
          python scripts/lock_dependencies.py --check
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip check

      - name: Lint (critical rules)
        id: lint
        run: |
          ruff check src tests scripts setup.py --select F,E9

      - name: Type check entry scripts and baseline runtime modules
        id: types
        run: |
          mypy \
            --ignore-missing-imports \
            --follow-imports=silent \
            scripts/run_assessment_snapshot.py \
            scripts/run_azuregoat_assessment.py \
            src/cris_sme/api/run_repository.py \
            src/cris_sme/api/supervisor.py \
            src/cris_sme/data_paths.py \
            src/cris_sme/controls/definitions.py \
            src/cris_sme/controls/registry.py \
            src/cris_sme/controls/validation.py

      - name: Validate full control metadata pack
        id: controls
        run: PYTHONPATH=src python scripts/validate_control_metadata.py

      - name: Validate capability evidence register
        id: capabilities
        run: python scripts/validate_capabilities.py

      - name: Run tests with package-wide branch coverage
        id: tests
        run: |
          PYTHONPATH=src pytest -q --cov --cov-report=term --cov-report=xml:coverage.xml --cov-report=json:coverage.json

      - name: Preserve coverage evidence
        if: ${{ always() && hashFiles('coverage.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ inputs.python-version }}
          path: |
            coverage.json
            coverage.xml
          retention-days: 7

      - name: Verify installed sdist and wheel
        id: package
        run: python scripts/check_installed_package.py

      - name: Run deterministic mock pipeline
        id: pipeline
        if: ${{ inputs.run-mock-pipeline }}
        run: |
          PYTHONPATH=src python scripts/run_assessment_snapshot.py --collector mock > /tmp/cris_sme_mock_run.json

      - name: Verify generated core outputs
        id: outputs
        if: ${{ inputs.run-mock-pipeline }}
        run: |
          test -f outputs/reports/cris_sme_report.json
          test -f outputs/reports/cris_sme_report.html
          test -f outputs/reports/cris_sme_dashboard.html
          test -f outputs/reports/cris_sme_dashboard_payload.json
          test -f outputs/reports/cris_sme_summary.txt
          test -f outputs/reports/cris_sme_evidence_snapshot.json

      - name: Verify deterministic assessment replay
        id: replay
        if: ${{ inputs.run-mock-pipeline }}
        run: |
          PYTHONPATH=src python scripts/check_replay_determinism.py --snapshot outputs/reports/cris_sme_evidence_snapshot.json

      - name: Docs sanity checks
        id: docs
        run: |
          python scripts/check_docs.py
          if rg -n '/Users/|/home/' README.md docs; then
            echo "Found machine-specific absolute links in docs/readme."
            exit 1
          fi

      - name: Paper package consistency checks
        id: paper
        run: |
          PYTHONPATH=src:. python scripts/validate_paper_package.py

      - name: Upload generated outputs
        id: upload
        if: ${{ inputs.upload-generated-artifacts && inputs.run-mock-pipeline }}
        uses: actions/upload-artifact@v4
        with:
          name: cris-sme-generated-outputs
          path: |
            outputs/reports
            outputs/figures
          retention-days: 7

      - name: Publish workflow summary
        if: ${{ always() }}
        env:
          QUALITY_STEPS: ${{ toJSON(steps) }}
          RUN_MOCK_PIPELINE: ${{ inputs.run-mock-pipeline }}
          UPLOAD_GENERATED_ARTIFACTS: ${{ inputs.upload-generated-artifacts }}
        run: |
          if [ -f scripts/quality_summary.py ]; then
            python3 scripts/quality_summary.py
          else
            echo "## CRIS-SME Quality Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "Checks incomplete: summary script unavailable; inspect checkout/setup logs." >> "$GITHUB_STEP_SUMMARY"
          fi
