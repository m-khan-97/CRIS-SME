name: Local Keycloak Identity Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json
      - name: Install isolated test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements/dev.txt
          npm ci --prefix frontend/console
          cd frontend/console
          npx playwright install --with-deps chromium
      - name: Download and verify Keycloak
        run: |
          curl --fail --location --proto '=https' https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.tar.gz --output .venv/keycloak.tar.gz
          printf '%s  %s\n' '4e2740b181faa2ea623a1c2ecf00855935311e546046e2f857615a47ed24cbe8' '.venv/keycloak.tar.gz' | sha256sum --check
          tar -xzf .venv/keycloak.tar.gz -C .venv
      - name: Prepare private local identities
        run: >-
          .venv/bin/python scripts/keycloak_local.py prepare
          --keycloak-home .venv/keycloak-26.8.1
          --java-home "$JAVA_HOME"
          --pg-bin /usr/lib/postgresql/16/bin
      - name: Start real local services
        run: .venv/bin/python scripts/keycloak_local.py start
      - name: Qualify browser identity, real JWT and PostgreSQL isolation
        working-directory: frontend/console
        run: npm run qualify:keycloak
      - name: Stop only qualification services
        if: ${{ always() }}
        run: |
          if test -f .local/keycloak/settings.json; then
            .venv/bin/python scripts/keycloak_local.py stop
          fi
      - name: Retain sanitized qualification outcome only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-identity-qualification
          path: |
            .local/keycloak/qualification/result.json
            .local/keycloak/qualification/owner-workspace.png
            .local/keycloak/qualification/failure.png
          retention-days: 7
