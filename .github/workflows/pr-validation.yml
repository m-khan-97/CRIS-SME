name: PR Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Console Tests and Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json
      - run: npm ci
      - name: Component route smoke tests
        run: npm test
      - name: Type check and build all deployment modes
        run: |
          npm run build
          npm run build:demo
          npm run build:selfhost

  container:
    name: Private Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build private trial image
        run: docker build -t cris-sme:ci .
      - name: Verify runtime and shutdown
        run: python3 scripts/check_container.py --image cris-sme:ci

  validate:
    name: Merge Quality Gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      python-version: ${{ matrix.python-version }}
      run-mock-pipeline: true
      upload-generated-artifacts: false
