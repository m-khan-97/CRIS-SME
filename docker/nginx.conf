server {
    listen 8080;
    server_name _;
    root /app/console;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location /outputs/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
