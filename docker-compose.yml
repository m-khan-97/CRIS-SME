services:
  cris-sme:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 20s
    volumes:
      - cris-sme-data:/data
    # Azure CLI / AWS credential discovery happens inside the container via
    # environment variables or a mounted credentials file; see
    # docs/azure-least-privilege-setup.md and docs/aws-least-privilege-setup.md.

volumes:
  cris-sme-data:
